<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FF828C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="良緣社">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="noindex, nofollow">
  <title>良緣社</title>
  <meta name="description" content="請拍手兩聲許願。良緣社．牽絲三十二卦。">
  <meta property="og:title" content="良緣社">
  <meta property="og:description" content="請拍手兩聲許願。良緣社．牽絲三十二卦。">
  <meta property="og:type" content="website">
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="apple-touch-icon" href="logo.png">
  <style>
/* 良緣社．牽絲三十二卦 — brand pink matches logo.png pixel #FF828C */
:root {
  --pink: #FF828C;
  --pink-deep: #F05E6A;
  --pink-shadow: #E24B58;
  --white: #FFFFFF;
  --white-92: rgba(255, 255, 255, 0.92);
  --white-80: rgba(255, 255, 255, 0.8);
  --white-64: rgba(255, 255, 255, 0.64);
  --white-40: rgba(255, 255, 255, 0.4);
  --white-22: rgba(255, 255, 255, 0.22);
  --white-12: rgba(255, 255, 255, 0.12);
  --font-serif: "Songti TC", "Noto Serif CJK TC", "Source Han Serif TC", "LiSong Pro", "PMingLiU", "STSong", serif;
  --font-sans: "PingFang TC", "Noto Sans CJK TC", "Heiti TC", "Microsoft JhengHei", "Source Han Sans TC", sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { background: var(--pink); }
body {
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--pink);
  color: var(--white);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
body[data-screen="oracle"] { overflow: hidden; height: 100vh; height: 100dvh; }
body[data-screen="result"] { overflow-x: hidden; overflow-y: auto; }
button, input { font-family: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:disabled { opacity: 0.5; cursor: default; }
img { display: block; max-width: 100%; height: auto; border: 0; }
h1, h2, p, blockquote { margin: 0; }
[hidden] { display: none !important; }
.visually-hidden {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

#app {
  min-height: 100vh;
  min-height: 100dvh;
  padding-left: max(20px, var(--safe-l));
  padding-right: max(20px, var(--safe-r));
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ===== LOGO ===== */
#brand {
  display: flex;
  justify-content: center;
  flex-shrink: 0;
  padding-top: calc(var(--safe-t) + 8px);
}
#site-logo {
  width: min(42vw, 172px);
  height: auto;
  user-select: none;
  pointer-events: none;
  transition: width 0.45s ease, margin 0.45s ease;
}
body[data-screen="result"] #site-logo {
  width: min(36vw, 152px);
  margin-top: -4px;
  margin-bottom: -6px;
}
@media (max-height: 720px) {
  body[data-screen="oracle"] #site-logo { width: min(34vw, 140px); }
}
@media (max-height: 620px) {
  body[data-screen="oracle"] #site-logo { width: min(28vw, 116px); }
}

main { width: 100%; max-width: 440px; flex: 1; display: flex; flex-direction: column; }
.screen { width: 100%; flex: 1; display: flex; flex-direction: column; align-items: center; }

/* ===== HOME ===== */
#screen-oracle { justify-content: flex-start; text-align: center; padding-bottom: calc(24px + var(--safe-b)); }
#screen-oracle .prompt { margin: 2px 0 8px; }
#screen-oracle .fine { margin-top: auto; }
.prompt {
  font-family: var(--font-serif);
  font-size: clamp(20px, 5.5vw, 26px);
  font-weight: 600;
  letter-spacing: 0.18em;
  line-height: 1.5;
  margin: 4px 0 28px;
  text-indent: 0.18em; /* optically center letter-spacing */
}
.home-cta { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }

.btn {
  appearance: none;
  border: 1.5px solid var(--white);
  background: transparent;
  color: var(--white);
  border-radius: 999px;
  min-height: 52px;
  padding: 0 28px;
  font-size: 16px;
  letter-spacing: 0.08em;
  font-weight: 600;
  transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease, opacity 0.15s;
  width: min(100%, 280px);
}
.btn:active { transform: scale(0.98); }
.btn:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }
.btn-primary { background: var(--white); color: var(--pink); border-color: var(--white); }
.btn-ghost { background: transparent; }
.btn-text {
  width: auto;
  min-height: 0;
  padding: 8px 12px;
  border: 0;
  background: none;
  color: var(--white-80);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.lookup {
  margin-top: auto;
  padding-top: 36px;
  width: 100%;
  max-width: 280px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.lookup-label {
  font-size: 13px;
  letter-spacing: 0.12em;
  color: var(--white-80);
}
.lookup-row { display: flex; gap: 8px; width: 100%; }
.lookup input {
  flex: 1;
  min-width: 0;
  height: 44px;
  border: 1.5px solid var(--white-40);
  background: var(--white-12);
  border-radius: 999px;
  text-align: center;
  font-size: 16px; /* iOS zoom-prevent */
  letter-spacing: 0.08em;
  color: var(--white);
  padding: 0 14px;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}
.lookup input::placeholder { color: var(--white-40); }
.lookup input:focus { border-color: var(--white); }
.lookup .btn { width: auto; min-height: 44px; padding: 0 18px; font-size: 14px; }
.lookup-msg { min-height: 1.2em; font-size: 13px; color: var(--white); }
.fine {
  margin-top: 18px;
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--white-64);
}

/* ===== LISTEN / DRAW ===== */
#screen-listen, #screen-draw { justify-content: flex-start; padding-bottom: calc(20px + var(--safe-b)); }
#screen-listen .prompt { margin-top: 6px; margin-bottom: 8px; }
#screen-draw .prompt { display: none; }

.tong-wrap {
  position: relative;
  display: block;
  width: min(58vw, 236px);
  margin: 48px auto 8px;
  aspect-ratio: 240 / 320;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  appearance: none;
  -webkit-appearance: none;
  overflow: visible;
  flex-shrink: 0;
}
.tong-wrap:focus-visible {
  outline: 2px solid var(--white);
  outline-offset: 6px;
  border-radius: 16px;
}
.tong-svg { width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.tong-wrap.idle { animation: idle-sway 3.6s ease-in-out infinite; }
.tong-wrap.shaking { animation: shake-tong 0.12s linear infinite; }
.tong-wrap.nudge { animation: tong-nudge 0.42s ease-out; }
.tong-wrap.rising .stick-rise { animation: stick-rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
.tong-wrap.shot-mid {
  animation: none !important;
  transform: rotate(-9deg) translate(-6px, 2px);
}
.tong-wrap.shot-mid .stick-rise {
  animation: none !important;
  transform: translateY(-40px);
}
@keyframes tong-nudge {
  0%, 100% { transform: rotate(0); }
  20% { transform: rotate(-8deg) translate(-4px, 1px); }
  45% { transform: rotate(7deg) translate(4px, -1px); }
  70% { transform: rotate(-4deg); }
}
@keyframes idle-sway {
  0%, 100% { transform: rotate(-1.6deg) translateY(0); }
  50% { transform: rotate(1.6deg) translateY(-3px); }
}
@keyframes shake-tong {
  0% { transform: rotate(-11deg) translate(-7px, 2px); }
  25% { transform: rotate(9deg) translate(8px, -2px); }
  50% { transform: rotate(-8deg) translate(-5px, 3px); }
  75% { transform: rotate(10deg) translate(6px, -1px); }
  100% { transform: rotate(-11deg) translate(-7px, 2px); }
}
@keyframes stick-rise {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-56px); opacity: 1; }
}
.status-line {
  font-family: var(--font-serif);
  font-size: 14px;
  letter-spacing: 0.16em;
  color: var(--white-80);
  min-height: 1.4em;
  margin: 2px 0 8px;
}
#btn-retry-mic { margin: 0 0 8px; }
#debug-panel {
  width: min(100%, 300px);
  margin: 4px 0 8px;
}
.debug-live {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 10px;
  letter-spacing: 0;
  color: var(--white-80);
  text-align: left;
  margin: 6px 0 8px;
  line-height: 1.4;
  word-break: break-all;
}

.meter-block { width: min(100%, 280px); margin: 4px 0 14px; }
.meter-track {
  position: relative;
  height: 8px;
  border-radius: 999px;
  background: var(--white-22);
  overflow: hidden;
}
.meter-fill {
  height: 100%;
  width: 0%;
  background: var(--white);
  border-radius: 999px;
  transition: width 50ms linear;
}
.meter-threshold {
  position: absolute;
  top: -3px; bottom: -3px;
  width: 2px;
  background: var(--white);
  opacity: 0.85;
  transform: translateX(-1px);
}
.clap-row {
  display: flex;
  justify-content: center;
  gap: 28px;
  margin: 6px 0 18px;
}
.clap-dot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 88px;
}
.clap-orb {
  width: 56px; height: 56px;
  border-radius: 50%;
  border: 2px solid var(--white-40);
  background: transparent;
  display: grid;
  place-items: center;
  font-family: var(--font-serif);
  font-size: 18px;
  transition: background 0.2s, border-color 0.2s, transform 0.2s, box-shadow 0.2s;
}
.clap-dot.on .clap-orb {
  background: var(--white);
  color: var(--pink);
  border-color: var(--white);
  box-shadow: 0 0 0 6px var(--white-22);
  transform: scale(1.06);
  animation: orb-pop 0.45s ease;
}
@keyframes orb-pop {
  0% { transform: scale(0.84); }
  60% { transform: scale(1.1); }
  100% { transform: scale(1.06); }
}
.clap-dot span.label { font-size: 12px; letter-spacing: 0.14em; color: var(--white-80); }

.sens {
  width: min(100%, 280px);
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 10px;
  margin: 8px 0 6px;
  font-size: 12px;
  letter-spacing: 0.1em;
  color: var(--white-80);
}
.sens input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  background: var(--white-22);
  border-radius: 999px;
  outline: none;
}
.sens input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--white);
  border: 0;
  box-shadow: 0 1px 4px rgba(180, 40, 50, 0.25);
}
.sens input[type="range"]::-moz-range-thumb {
  width: 22px; height: 22px; border-radius: 50%; background: var(--white); border: 0;
}
.hint { font-size: 13px; color: var(--white-80); text-align: center; margin-top: 8px; }
.denied-box { text-align: center; width: min(100%, 300px); margin-top: 8px; }
.denied-box p { margin-bottom: 16px; color: var(--white-92); }

/* ===== RESULT ===== */
#screen-result {
  align-items: stretch;
  padding-bottom: calc(8px + var(--safe-b));
}
.result-inner { width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; }
.result-fine { margin-top: 24px; }
.lot-meta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 8px 0 6px;
  letter-spacing: 0.14em;
  font-size: 14px;
  color: var(--white-92);
}
.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--white);
  border-radius: 999px;
  padding: 1px 10px;
  letter-spacing: 0.16em;
  font-size: 12px;
  line-height: 1.6;
}
.badge.great { background: var(--white); color: var(--pink); border-color: var(--white); }
.badge.bad { border-style: dashed; }
#lot-name {
  font-family: var(--font-serif);
  font-size: clamp(30px, 9vw, 42px);
  font-weight: 700;
  letter-spacing: 0.12em;
  line-height: 1.3;
  margin: 4px 0 18px;
  text-indent: 0.12em;
}
.verse {
  font-family: var(--font-serif);
  font-size: clamp(15px, 4.2vw, 17px);
  line-height: 2;
  letter-spacing: 0.02em;
  white-space: pre-line;
  color: var(--white-92);
  margin-bottom: 18px;
  max-width: 100%;
  font-size: clamp(14px, 4vw, 17px);
}
.explain {
  font-size: 14px;
  line-height: 1.9;
  color: var(--white-80);
  text-align: justify;
  text-justify: inter-ideograph;
  margin-bottom: 22px;
  max-width: 36em;
}
.punch {
  font-family: var(--font-serif);
  font-size: clamp(18px, 5.2vw, 22px);
  line-height: 1.7;
  letter-spacing: 0.04em;
  color: var(--white);
  margin: 0 0 28px;
  max-width: 20em;
  position: relative;
  padding: 8px 0.4em;
}
.punch::before, .punch::after {
  font-family: var(--font-serif);
  color: var(--white-64);
  font-size: 1.15em;
}
.punch::before { content: "「"; }
.punch::after { content: "」"; }
.punch.has-quotes::before, .punch.has-quotes::after { content: none; }

.tabs {
  display: flex;
  gap: 0;
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border-bottom: 1px solid var(--white-22);
  margin-bottom: 14px;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1 0 auto;
  appearance: none;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  color: var(--white-64);
  font-size: 12.5px;
  letter-spacing: 0.02em;
  padding: 10px 6px 8px;
  margin-bottom: -1px;
  white-space: nowrap;
  font-weight: 500;
}
.tab[aria-selected="true"] {
  color: var(--white);
  border-bottom-color: var(--white);
  font-weight: 600;
}
.tab:focus-visible { outline: 2px solid var(--white); outline-offset: -2px; }
#tab-panel {
  text-align: justify;
  text-justify: inter-ideograph;
  font-size: 15px;
  line-height: 1.9;
  color: var(--white-92);
  min-height: 4.5em;
  margin-bottom: 28px;
  width: 100%;
}

.actions {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  width: 100%;
  margin-bottom: 8px;
}

.products {
  width: 100%;
  margin-top: 36px;
  padding-top: 24px;
  border-top: 1px solid var(--white-22);
  text-align: left;
}
.products h2 {
  font-family: var(--font-serif);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-align: center;
  margin-bottom: 14px;
}
.product-list { display: flex; flex-direction: column; gap: 10px; }
.product {
  display: block;
  border: 1px solid var(--white-22);
  border-radius: 16px;
  padding: 14px 16px;
  color: var(--white);
  text-decoration: none;
  background: var(--white-12);
}
.product.is-placeholder { pointer-events: none; }
.product-name { font-weight: 600; letter-spacing: 0.04em; }
.product-desc { font-size: 13px; color: var(--white-80); margin-top: 4px; }
.product-tag {
  display: inline-block;
  margin-top: 8px;
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--white-64);
  border: 1px solid var(--white-22);
  border-radius: 999px;
  padding: 1px 8px;
}

#screen-result .lookup { margin-top: 28px; padding-top: 0; }

/* share toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + var(--safe-b));
  transform: translateX(-50%) translateY(16px);
  background: var(--white);
  color: var(--pink);
  border-radius: 999px;
  padding: 10px 18px;
  font-size: 14px;
  letter-spacing: 0.06em;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  z-index: 20;
  box-shadow: 0 8px 24px rgba(180, 40, 50, 0.2);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (prefers-reduced-motion: reduce) {
  .tong-wrap.idle, .tong-wrap.shaking, .tong-wrap.nudge, .tong-wrap.rising .stick-rise, .clap-dot.on .clap-orb {
    animation: none;
  }
  #site-logo { transition: none; }
}

@media (max-height: 740px) {
  body[data-screen="result"] #site-logo { width: min(28vw, 112px); margin-top: -8px; margin-bottom: -10px; }
  body[data-screen="oracle"] #site-logo { width: min(34vw, 140px); }
  #screen-oracle .prompt { font-size: 20px; margin-top: 0; margin-bottom: 6px; }
  .tong-wrap { width: min(50vw, 200px); margin-top: 24px; }
  .clap-orb { width: 48px; height: 48px; }
  .clap-row { margin-bottom: 10px; }
}
@media (max-height: 640px) {
  body[data-screen="oracle"] #site-logo { width: min(28vw, 116px); }
  .tong-wrap { width: min(42vw, 168px); margin-top: 12px; }
}

  </style>
</head>
<body data-screen="oracle" data-oracle="await">

<div id="app">
  <header id="brand">
    <!-- 【LOGO】更換品牌標誌：把檔案放到同資料夾，只改下一行的 src（logo.png 或 logo.svg 皆可）。分享圖卡會自動使用同一份。 -->
    <img id="site-logo" src="logo.png" alt="良緣社">
  </header>

  <main>
    <section id="screen-oracle" class="screen" aria-label="求籤">
      <h1 class="prompt">請拍手兩聲許願</h1>

      <button type="button" class="tong-wrap idle" id="tong" aria-label="輕觸籤筒開始"></button>
      <p class="status-line" id="oracle-hint">輕觸籤筒開始</p>
      <button type="button" class="btn-text" id="btn-retry-mic" hidden>再試一次麥克風</button>

      <div id="debug-panel" hidden>
        <div class="meter-block" id="meter-block">
          <div class="meter-track" aria-hidden="true">
            <div class="meter-fill" id="meter-fill"></div>
            <div class="meter-threshold" id="meter-threshold"></div>
          </div>
        </div>
        <p class="debug-live" id="debug-live">lvl —</p>
        <div class="sens">
          <span>低</span>
          <input id="sensitivity" type="range" min="0" max="100" value="80" aria-label="拍手靈敏度">
          <span>高</span>
        </div>
        <div class="clap-row" aria-hidden="true">
          <div class="clap-dot" id="clap-1">
            <div class="clap-orb">一</div>
            <span class="label">第一聲</span>
          </div>
          <div class="clap-dot" id="clap-2">
            <div class="clap-orb">二</div>
            <span class="label">第二聲</span>
          </div>
        </div>
      </div>

      <p class="fine">良緣社　本頁不蒐集任何資料</p>
    </section>

    <section id="screen-result"    <section id="screen-result" class="screen" hidden aria-label="籤詩">
      <div class="result-inner">
        <p class="lot-meta">
          <span id="lot-no"></span>
          <span id="lot-fortune" class="badge"></span>
        </p>
        <h1 id="lot-name"></h1>
        <p id="lot-verse" class="verse"></p>
        <p id="lot-explain" class="explain"></p>
        <blockquote id="lot-punch" class="punch"></blockquote>

        <div class="tabs" role="tablist" aria-label="詳情解讀">
          <button type="button" class="tab" role="tab" id="tab-btn-曖昧告白" data-tab="曖昧告白" aria-selected="true">曖昧告白</button>
          <button type="button" class="tab" role="tab" id="tab-btn-穩定關係" data-tab="穩定關係" aria-selected="false">穩定關係</button>

/* 良緣社拍手偵測核心：瀏覽器與 Node 離線測試共用 */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.LiangyuanClap = factory();
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  function clamp(n, a, b) {
    return Math.max(a, Math.min(b, n));
  }

  function paramsFromSensitivity(sens) {
    const t = clamp((Number(sens) || 80) / 100, 0, 1);
    return {
      k: 4.5 - t * 2.1,           // 4.5 … 2.4
      minAbs: 0.12 - t * 0.08,    // 0.12 … 0.04
      onsetRatio: 2.5 - t * 0.7   // 2.5 … 1.8
    };
  }

  function createDetector(opts) {
    const o = Object.assign({
      sensitivity: 80,
      minGap: 120,
      maxGap: 900,
      refractory: 90,
      floorMin: 0.0025,
      floorMax: 0.22,
      floorUp: 0.004,
      floorDown: 0.10
    }, opts || {});

    const st = {
      floor: 0.01,
      prevEnergy: 0,
      cooldownUntil: 0,
      energy: 0,
      thresh: 0,
      jump: 0
    };

    function setSensitivity(v) {
      o.sensitivity = Number(v);
    }

    function ingest(peak, rms, now) {
      const p = paramsFromSensitivity(o.sensitivity);
      const energy = Math.max(Number(peak) || 0, (Number(rms) || 0) * 2);
      const quiet = energy < st.floor * 1.7;
      const alpha = quiet ? o.floorDown : o.floorUp;
      const floorSample = Math.min((Number(rms) || 0) * 1.3, energy);
      st.floor = clamp(st.floor + (floorSample - st.floor) * alpha, o.floorMin, o.floorMax);

      const thresh = Math.max(st.floor * p.k, p.minAbs);
      const denom = Math.max(st.prevEnergy, st.floor, 1e-4);
      const jump = energy / denom;
      const isOnset = energy > thresh && jump >= p.onsetRatio;
      let clap = false;
      if (isOnset && now >= st.cooldownUntil) {
        clap = true;
        st.cooldownUntil = now + o.refractory;
      }
      st.prevEnergy = Math.max(energy, st.prevEnergy * 0.62);
      st.energy = energy;
      st.thresh = thresh;
      st.jump = jump;
      return { clap: clap, energy: energy, thresh: thresh, floor: st.floor, jump: jump };
    }

    function resetFloor(value) {
      st.floor = clamp(value == null ? 0.01 : value, o.floorMin, o.floorMax);
      st.prevEnergy = 0;
      st.cooldownUntil = 0;
    }

    return {
      ingest: ingest,
      setSensitivity: setSensitivity,
      resetFloor: resetFloor,
      state: st,
      opts: o,
      paramsFromSensitivity: paramsFromSensitivity
    };
  }

  function createPairTracker(opts) {
    const o = Object.assign({ minGap: 120, maxGap: 900 }, opts || {});
    const st = { count: 0, firstAt: 0 };

    function reset() {
      st.count = 0;
      st.firstAt = 0;
    }

    function feed(now) {
      if (st.count === 0) {
        st.count = 1;
        st.firstAt = now;
        return { event: "first", gap: 0, count: 1 };
      }
      const gap = now - st.firstAt;
      if (gap < o.minGap) return { event: "ignore", gap: gap, count: st.count };
      if (gap > o.maxGap) {
        st.count = 1;
        st.firstAt = now;
        return { event: "restart", gap: gap, count: 1 };
      }
      st.count = 2;
      return { event: "pair", gap: gap, count: 2 };
    }

    function tick(now) {
      if (st.count === 1 && now - st.firstAt > o.maxGap) {
        reset();
        return { event: "timeout" };
      }
      return null;
    }

    return { feed: feed, tick: tick, reset: reset, state: st, opts: o };
  }

  return {
    createDetector: createDetector,
    createPairTracker: createPairTracker,
    paramsFromSensitivity: paramsFromSensitivity
  };
});

function parseQuery() {

  const raw = q.get("n");
  if (raw == null || raw === "") return null;
  const n = parseInt(raw, 10);
  if (!Number.isInteger(n) || n < 1 || n > 32) return null;
  return n;
}

  return new URLSearchParams(location.search).get("debug") === "1";
}

function lotByN(n) {
  return LOTS.find((l) => l.n === n) || null;
}

function randomLot(exceptN) {
  const buf = new Uint32Array(1);
  let pick;
  let guard = 0;
  do {
    crypto.getRandomValues(buf);
    pick = LOTS[buf[0] % LOTS.length];
    guard += 1;
  } while (exceptN && pick.n === exceptN && guard < 6);
  return pick;
}

/* ---------- 音效 ---------- */
function getAudioCtx() {
  if (!state.audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    state.audioCtx = new AC();
  }
  return state.audioCtx;
}

async function resumeAudio() {
  const ctx = getAudioCtx();
  if (ctx && ctx.state === "suspended") {
    try { await ctx.resume(); } catch (e) { /* ignore */ }
  }
  return ctx;
}

function playTick() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const t = ctx.currentTime;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = "triangle";
  o.frequency.setValueAtTime(920, t);
  o.frequency.exponentialRampToValueAtTime(380, t + 0.07);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.1, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
  o.connect(g).connect(ctx.destination);
  o.start(t);
  o.stop(t + 0.12);
}

function playRattle() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const duration = 1.15;
  const frames = Math.floor(ctx.sampleRate * duration);
  const buffer = ctx.createBuffer(1, frames, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < frames; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  const bp = ctx.createBiquadFilter();
  bp.type = "bandpass";
  bp.frequency.value = 1400;
  bp.Q.value = 0.9;
  const g = ctx.createGain();
  const t = ctx.currentTime;
  g.gain.setValueAtTime(0.0001, t);
  for (let i = 0; i < 8; i++) {
    const at = t + i * 0.13 + Math.random() * 0.03;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(0.08, at + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.07);
  }
  src.connect(bp).connect(g).connect(ctx.destination);
  src.start(t);
  src.stop(t + duration);
}

function playReveal() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const notes = [523.25, 659.25, 830.61];
  const t0 = ctx.currentTime;
  notes.forEach((freq, i) => {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "sine";
    o.frequency.value = freq;
    const t = t0 + i * 0.12;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.09, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
    o.connect(g).connect(ctx.destination);
    o.start(t);
    o.stop(t + 0.75);
  });
}

function buzz(pattern) {
  try {
    if (navigator.vibrate) navigator.vibrate(pattern);
  } catch (e) { /* iOS Safari 多半不支援 */ }
}

/* ---------- 拍手偵測 ---------- */
function newDetector() {
  const api = window.LiangyuanClap;
  state.detector = api.createDetector({
    sensitivity: state.sensitivity,
    minGap: CLAP.minGap,
    maxGap: CLAP.maxGap,
    refractory: CLAP.refractory
  });
  state.pair = api.createPairTracker({ minGap: CLAP.minGap, maxGap: CLAP.maxGap });
}

function updateThresholdMark() {
  if (!state.debug) return;
  const api = window.LiangyuanClap;
  if (!api) return;
  const p = api.paramsFromSensitivity(state.sensitivity);
  const floor = (state.detector && state.detector.state.floor) || 0.01;
  const thresh = Math.max(floor * p.k, p.minAbs);
  const mark = $("meter-threshold");
  if (mark) mark.style.left = Math.min(96, Math.max(2, thresh * 100)) + "%";
}

function updateDebugMeter(r) {
  if (!state.debug || !r) return;
  const fill = $("meter-fill");
  const mark = $("meter-threshold");
  const live = $("debug-live");
  if (fill) fill.style.width = Math.min(100, r.energy * 140).toFixed(1) + "%";
  if (mark) mark.style.left = Math.min(96, Math.max(2, r.thresh * 140)) + "%";
  if (live) {
    const n = state.pair ? state.pair.state.count : 0;
    live.textContent = "lvl " + r.energy.toFixed(3) +
      "  thr " + r.thresh.toFixed(3) +
      "  floor " + r.floor.toFixed(3) +
      "  jump " + r.jump.toFixed(2) +
      "  claps " + n;
  }
}

function setClapDots(n) {
  const a = $("clap-1");
  const b = $("clap-2");
  if (a) a.classList.toggle("on", n >= 1);
  if (b) b.classList.toggle("on", n >= 2);
}

function resetClaps() {
  state.clapCount = 0;
  state.firstClapAt = 0;
  if (state.pair) state.pair.reset();
  setClapDots(0);
}

function canAcceptClap() {
  if (state.drawing || state.screen !== "oracle") return false;
  const mode = document.body.dataset.oracle;
  return mode === "listening" || mode === "denied";
}

function registerClap(now) {
  if (!canAcceptClap()) return;
  if (!state.pair) newDetector();
  const ev = state.pair.feed(now);
  if (ev.event === "ignore") return;
  const denied = document.body.dataset.oracle === "denied";
  if (ev.event === "first" || ev.event === "restart") {
    state.clapCount = 1;
    state.firstClapAt = now;
    setClapDots(1);
    nudgeTong();
    if (ev.event === "restart") {
      setHint(denied ? "間隔太久了，再輕觸兩次" : "間隔太久了，再拍兩聲");
    } else {
      setHint(denied ? "再輕觸一次" : "再拍第二聲");
    }
    buzz(40);
    return;
  }
  if (ev.event === "pair") {
    state.clapCount = 2;
    setClapDots(2);
    setHint("緣來了");
    buzz([40, 50, 80]);
    const except = state.currentLot && state.currentLot.n;
    beginDraw(randomLot(except));
  }
}

function onHop(peak, rms) {
  if (!state.detector || state.drawing) return;
  if (document.body.dataset.oracle !== "listening") return;
  const now = performance.now();
  const r = state.detector.ingest(peak, rms, now);
  updateDebugMeter(r);
  if (r.clap) registerClap(now);
  if (state.pair) {
    const to = state.pair.tick(now);
    if (to && to.event === "timeout") {
      resetClaps();
      setHint("再拍兩聲許願");
    }
  }
}

function onFrame() {
  if (!state.analyser) return;
  state.analyser.getByteTimeDomainData(state.td);
  const td = state.td;
  let sum = 0;
  let peak = 0;
  for (let i = 0; i < td.length; i++) {
    const v = (td[i] - 128) / 128;
    const a = v < 0 ? -v : v;
    if (a > peak) peak = a;
    sum += v * v;
  }
  const rms = Math.sqrt(sum / td.length);
  onHop(peak, rms);
}

function stopMicLoop() {
  if (state.raf) {
    cancelAnimationFrame(state.raf);
    state.raf = 0;
  }
  if (state.hopTimer) {
    clearInterval(state.hopTimer);
    state.hopTimer = 0;
  }
}

function detachMic() {
  stopMicLoop();
  try { if (state.worklet && state.worklet.port) state.worklet.port.onmessage = null; } catch (e) {}
  try { if (state.proc) state.proc.onaudioprocess = null; } catch (e) {}
  ["source", "filter", "proc", "worklet", "analyser", "mute"].forEach((k) => {
    try { if (state[k]) state[k].disconnect(); } catch (e) {}
    state[k] = null;
  });
  if (state.stream) {
    state.stream.getTracks().forEach((tr) => tr.stop());
    state.stream = null;
  }
}

const WORKLET_SRC = [
  "class LiangyuanClapProcessor extends AudioWorkletProcessor {",
  "  constructor() { super(); this._peak = 0; this._sum = 0; this._n = 0; this._target = 256; }",
  "  process(inputs) {",
  "    const ch = inputs[0] && inputs[0][0];",
  "    if (ch) {",
  "      for (let i = 0; i < ch.length; i++) {",
  "        const v = ch[i];",
  "        const a = v < 0 ? -v : v;",
  "        if (a > this._peak) this._peak = a;",
  "        this._sum += v * v;",
  "        this._n++;",
  "      }",
  "      if (this._n >= this._target) {",
  "        this.port.postMessage({ peak: this._peak, rms: Math.sqrt(this._sum / this._n) });",
  "        this._peak = 0; this._sum = 0; this._n = 0;",
  "      }",
  "    }",
  "    return true;",
  "  }",
  "}",
  "registerProcessor('liangyuan-clap', LiangyuanClapProcessor);"
].join("\\n");

async function attachHopProcessor(ctx, filter) {
  const mute = ctx.createGain();
  mute.gain.value = 0;
  state.mute = mute;
  if (ctx.audioWorklet && ctx.audioWorklet.addModule) {
    try {
      const blob = new Blob([WORKLET_SRC.replace(/\\\\n/g, "\\n")], { type: "text/javascript" });
      const url = URL.createObjectURL(blob);
      try {
        await ctx.audioWorklet.addModule(url);
      } finally {
        URL.revokeObjectURL(url);
      }
      const node = new AudioWorkletNode(ctx, "liangyuan-clap");
      node.port.onmessage = (ev) => onHop(ev.data.peak, ev.data.rms);
      filter.connect(node);
      node.connect(mute);
      mute.connect(ctx.destination);
      state.worklet = node;
      return "worklet";
    } catch (err) { /* fall through to ScriptProcessor */ }
  }
  const AC = ctx.constructor;
  if (typeof ctx.createScriptProcessor === "function" || typeof ctx.createJavaScriptNode === "function") {
    const proc = (ctx.createScriptProcessor || ctx.createJavaScriptNode).call(ctx, 512, 1, 1);
    proc.onaudioprocess = (ev) => {
      const input = ev.inputBuffer.getChannelData(0);
      let peak = 0, sum = 0;
      for (let i = 0; i < input.length; i++) {
        const v = input[i];
        const a = v < 0 ? -v : v;
        if (a > peak) peak = a;
        sum += v * v;
      }
      onHop(peak, Math.sqrt(sum / input.length));
    };
    filter.connect(proc);
    proc.connect(mute);
    mute.connect(ctx.destination);
    state.proc = proc;
    return "script";
  }
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 1024;
  analyser.smoothingTimeConstant = 0;
  filter.connect(analyser);
  state.analyser = analyser;
  state.td = new Uint8Array(analyser.fftSize);
  stopMicLoop();
  state.hopTimer = setInterval(onFrame, 8);
  return "analyser";
}

async function startMic() {
  if (!window.isSecureContext && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
    throw new Error("insecure");
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error("unsupported");
  }
  await resumeAudio();
  const constraints = {
    audio: {
      echoCancellation: false,
      noiseSuppression: false,
      autoGainControl: false,
      channelCount: 1
    }
  };
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia(constraints);
  } catch (err) {
    if (err && err.name === "NotAllowedError") throw err;
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  }
  detachMic();
  const ctx = await resumeAudio();
  if (!ctx) throw new Error("unsupported");
  const source = ctx.createMediaStreamSource(stream);
  const filter = ctx.createBiquadFilter();
  filter.type = "highpass";
  filter.frequency.value = 1500;
  filter.Q.value = 0.7;
  source.connect(filter);

  state.stream = stream;
  state.source = source;
  state.filter = filter;
  newDetector();
  state.detector.resetFloor(0.01);
  state.cooldownUntil = performance.now() + 250;
  if (state.detector) state.detector.state.cooldownUntil = state.cooldownUntil;
  resetClaps();
  updateThresholdMark();
  await attachHopProcessor(ctx, filter);
}

function detachMicKeepStream() {
  stopMicLoop();
  try { if (state.worklet && state.worklet.port) state.worklet.port.onmessage = null; } catch (e) {}
  try { if (state.proc) state.proc.onaudioprocess = null; } catch (e) {}
  ["source", "filter", "proc", "worklet", "analyser", "mute"].forEach((k) => {
    try { if (state[k]) state[k].disconnect(); } catch (e) {}
    state[k] = null;
  });
}

async function onStartWish() {
  try {
    await resumeAudio();
    await startMic();
    showScreen("listen");
  } catch (err) {
    detachMic();
    const text = $("denied-text");
    const hint = (err && err.name === "NotAllowedError")
      ? "沒有麥克風權限，請輕觸籤筒兩次抽籤。"
      : (err && err.message === "insecure")
      ? "麥克風需要在 HTTPS 安全連線下才能開啟，請輕觸籤筒兩次抽籤。"
      : (err && (err.name === "NotFoundError" || err.message === "unsupported"))
      ? "這台裝置沒有可用的麥克風，請輕觸籤筒兩次抽籤。"
      : "無法使用麥克風，請輕觸籤筒兩次抽籤。";
    if (text) text.textContent = hint;
    showScreen("denied");
    setHint(hint, "輕觸籤筒兩次抽籤");
  }
}

function onOracleActivate(ev) {
  if (state.screen !== "oracle" || state.drawing) return;
  if (ev.target.closest && (ev.target.closest("#btn-retry-mic") || ev.target.closest("#debug-panel"))) return;
  const mode = document.body.dataset.oracle;
  if (mode === "await") {
    ev.preventDefault();
    onStartWish();
  } else if (mode === "denied") {
    ev.preventDefault();
    registerClap(performance.now());
  } else if (mode === "listening") {
    resumeAudio();
  }
}

/* ---------- 抽籤動畫與揭示 ---------- */
function reducedMotion() {
  return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

function beginDraw(lot) {
  if (state.drawing) return;
  state.drawing = true;
  state.currentLot = lot;
  detachMic();
  showScreen("draw");
  const tong = $("tong");
  if (tong) {
    tong.classList.remove("idle", "nudge", "shot-mid");
    tong.classList.add("shaking");
  }
  playRattle();

  const shakeMs = reducedMotion() ? 200 : 700;
  const holdMs = reducedMotion() ? 80 : 450;
  setTimeout(() => {
    if (tong) tong.classList.add("rising");
    setHint("籤出");
  }, reducedMotion() ? 40 : 180);
  setTimeout(() => {
    if (tong) tong.classList.remove("shaking");
  }, shakeMs);
  setTimeout(() => {
    playReveal();
    buzz([20, 40, 20, 40, 120]);
    revealLot(lot, { replaceUrl: false });
    state.drawing = false;
    if (tong) tong.classList.remove("rising", "shaking", "shot-mid");
  }, shakeMs + holdMs);
}

function fortuneClass(fortune) {
  if (fortune === "大吉" || fortune === "上上") return "badge great";
  if (fortune === "下下") return "badge bad";
  return "badge";
}

function revealLot(lot, opts) {
  state.currentLot = lot;
  $("lot-no").textContent = "第 " + lot.n + " 籤";
  const badge = $("lot-fortune");
  badge.textContent = lot.fortune;
  badge.className = fortuneClass(lot.fortune);
  $("lot-name").textContent = lot.name;
  $("lot-verse").textContent = lot.verse;
  $("lot-explain").textContent = lot.explain;
  const punchEl = $("lot-punch");
  punchEl.textContent = lot.punch;
  punchEl.classList.toggle("has-quotes", String(lot.punch).startsWith("「"));
  setTab("曖昧告白");
  renderProducts(lot);
  document.title = "良緣社．" + lot.name;
  if (opts && opts.replaceUrl) {
    const url = new URL(location.href);
    url.searchParams.set("n", String(lot.n));
    history.replaceState({}, "", url);
  }
  showScreen("result");
}

function setTab(key) {
  state.activeTab = key;
  TABS.forEach((t) => {
    const btn = document.querySelector('.tab[data-tab="' + t.key + '"]');
    if (!btn) return;
    const on = t.key === key;
    btn.setAttribute("aria-selected", on ? "true" : "false");
  });
  const panel = $("tab-panel");
  const lot = state.currentLot;
  panel.textContent = lot && lot.detail ? (lot.detail[key] || "") : "";
  const btn = document.querySelector('.tab[data-tab="' + key + '"]');
  if (btn) panel.setAttribute("aria-labelledby", btn.id);
}

function renderProducts(lot) {
  const list = $("product-list");
  if (!list) return;
  list.innerHTML = "";
  const items = (SHOPLINE_PRODUCTS.byLot && SHOPLINE_PRODUCTS.byLot[lot.n]) || SHOPLINE_PRODUCTS.defaults || [];
  items.forEach((item) => {
    const hasUrl = !!(SHOPLINE_PRODUCTS.enabled && item.url);
    const el = document.createElement(hasUrl ? "a" : "div");
    el.className = "product" + (hasUrl ? "" : " is-placeholder");
    if (hasUrl) {
      el.href = item.url;
      el.target = "_blank";
      el.rel = "noopener noreferrer";
    }
    const name = document.createElement("div");
    name.className = "product-name";
    name.textContent = item.name || "（商品名稱待填）";
    const desc = document.createElement("div");
    desc.className = "product-desc";
    desc.textContent = item.desc || "";
    el.appendChild(name);
    el.appendChild(desc);
    if (!hasUrl) {
      const tag = document.createElement("span");
      tag.className = "product-tag";
      tag.textContent = "Shopline 連結待設定";
      el.appendChild(tag);
    }
    list.appendChild(el);
  });
  const prodRoot = $("products"); if (!prodRoot) return;
  prodRoot.querySelector("h2").textContent = SHOPLINE_PRODUCTS.heading || "抽到這支籤的人也在看";
}

function lookupFrom(inputId, msgId) {
  const raw = ($(inputId).value || "").trim();
  const n = parseInt(raw, 10);
  const msg = $(msgId);
  if (!Number.isInteger(n) || n < 1 || n > 32) {
    msg.textContent = "請輸入 1 到 32 的籤序";
    return;
  }
  const lot = lotByN(n);
  if (!lot) {
    msg.textContent = "找不到這支籤";
    return;
  }
  msg.textContent = "";
  detachMic();
  revealLot(lot, { replaceUrl: true });
}

function goHomeForNewDraw() {
  detachMic();
  state.currentLot = null;
  state.drawing = false;
  document.title = "良緣社";
  const url = new URL(location.href);
  url.searchParams.delete("n");
  history.replaceState({}, "", url);
  resetClaps();
  poseTong("home");
  showScreen("oracle");
  tryAutoStartMic();
}

/* ---------- 分享圖卡 ---------- */
function wrapText(ctx, text, maxWidth) {
  const parts = text.split(/([，。！？、；」「])/).filter((s) => s !== "");
  const chunks = [];
  for (const p of parts) {
    if (p === "「") chunks.push("「");
    else if (/^[，。！？、；」]$/.test(p) && chunks.length) chunks[chunks.length - 1] += p;
    else if (chunks.length && chunks[chunks.length - 1] === "「") chunks[chunks.length - 1] += p;
    else chunks.push(p);
  }
  const lines = [];
  let line = "";
  const flushChars = (str) => {
    for (const ch of Array.from(str)) {
      if (ctx.measureText(line + ch).width > maxWidth && line) {
        lines.push(line);
        line = ch;
      } else {
        line += ch;
      }
    }
  };
  for (const chunk of chunks) {
    if (ctx.measureText(line + chunk).width <= maxWidth) {
      line += chunk;
    } else {
      if (line) {
        lines.push(line);
        line = "";
      }
      if (ctx.measureText(chunk).width <= maxWidth) line = chunk;
      else flushChars(chunk);
    }
  }
  if (line) lines.push(line);
  return lines;
}

function withOuterQuotes(text) {
  const t = String(text || "");
  if (t.startsWith("「")) return t;
  return "「" + t + "」";
}

function loadLogoImage() {
  return new Promise((resolve, reject) => {
    const src = logoEl() ? logoEl().getAttribute("src") : "logo.png";
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("logo"));
    img.src = src;
  });
}

async function renderShareCard(lot) {
  const W = 1080, H = 1920;
  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#FF828C";
  ctx.fillRect(0, 0, W, H);

  const serif = '"Songti TC","Noto Serif CJK TC","Source Han Serif TC","PingFang TC","Heiti TC",serif';
  const sans = '"PingFang TC","Noto Sans CJK TC","Heiti TC","Microsoft JhengHei",sans-serif';

  try {
    const logo = await loadLogoImage();
    const size = 620;
    ctx.drawImage(logo, (W - size) / 2, 80, size, size);
  } catch (e) {
    ctx.fillStyle = "#FFFFFF";
    ctx.font = '700 84px ' + serif;
    ctx.textAlign = "center";
    ctx.fillText("良緣社", W / 2, 360);
  }

  ctx.fillStyle = "#FFFFFF";
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";

  ctx.font = "500 36px " + sans;
  ctx.fillText("第 " + lot.n + " 籤　　" + lot.fortune, W / 2, 780);

  ctx.font = "700 72px " + serif;
  ctx.fillText(lot.name, W / 2, 880);

  ctx.font = "600 58px " + serif;
  const punchLines = wrapText(ctx, withOuterQuotes(lot.punch), 860);
  const lineH = 92;
  const startY = 1040;
  punchLines.forEach((ln, i) => {
    ctx.fillText(ln, W / 2, startY + i * lineH);
  });

  ctx.globalAlpha = 0.8;
  ctx.font = "500 28px " + sans;
  ctx.fillText("良緣社　牽絲三十二卦", W / 2, 1780);
  ctx.globalAlpha = 1;

  return new Promise((resolve) => canvas.toBlob((b) => resolve(b), "image/png"));
}

function downloadBlob(blob, filename) {
  const a = document.createElement("a");
  const url = URL.createObjectURL(blob);
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function shareLot() {
  const lot = state.currentLot;
  if (!lot) return;
  const btn = $("btn-share");
  btn.disabled = true;
  try {
    const blob = await renderShareCard(lot);
    const filename = "良緣社-第" + lot.n + "籤-" + lot.name + ".png";
    const file = new File([blob], filename, { type: "image/png" });
    const text = lot.punch + "\n——良緣社．" + lot.name;
    let shared = false;
    if (navigator.canShare) {
      try {
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: "良緣社", text: text });
          shared = true;
        } else if (navigator.share) {
          downloadBlob(blob, filename);
          await navigator.share({ title: "良緣社", text: text });
          shared = true;
        }
      } catch (e) {
        if (e && e.name === "AbortError") { shared = true; }
        else shared = false;
      }
    }
    if (!shared) {
      downloadBlob(blob, filename);
      showToast("已下載分享圖，可傳到限動或 Threads");
    }
  } catch (e) {
    showToast("分享圖產生失敗，請再試一次");
  } finally {
    btn.disabled = false;
  }
}

/* ---------- 綁定 ---------- */
function bindLookup(formId, inputId, msgId) {
  const form = $(formId);
  if (!form) return;
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    lookupFrom(inputId, msgId);
  });
}

function init() {
  mountTong();
  newDetector();
  state.debug = isDebugQuery();
  if (state.debug) {
    document.body.dataset.debug = "1";
    const panel = $("debug-panel");
    if (panel) panel.hidden = false;
  }

  document.querySelectorAll(".tab").forEach((btn) => {
    btn.setAttribute("aria-label", ({
      "曖昧告白": "問曖昧告白",
      "穩定關係": "問穩定關係",
      "復合": "問復合",
      "社群動態": "問社群動態",
      "建議": "建議"
    })[btn.dataset.tab] || btn.dataset.tab);
    btn.addEventListener("click", () => setTab(btn.dataset.tab));
  });

  const oracle = $("screen-oracle");
  if (oracle) oracle.addEventListener("click", onOracleActivate);
  const retry = $("btn-retry-mic");
  if (retry) retry.addEventListener("click", (e) => { e.stopPropagation(); onStartWish(); });
  $("btn-again").addEventListener("click", goHomeForNewDraw);
  $("btn-share").addEventListener("click", shareLot);

  const sens = $("sensitivity");
  if (sens) {
    sens.value = String(state.sensitivity);
    sens.addEventListener("input", (e) => {
      state.sensitivity = Number(e.target.value);
      if (state.detector) state.detector.setSensitivity(state.sensitivity);
      updateThresholdMark();
    });
  }

  const n = parseQuery();
  if (n) {
    const lot = lotByN(n);
    if (lot) {
      revealLot(lot, { replaceUrl: false });
      return;
    }
  }
  showScreen("oracle");
  tryAutoStartMic();
}

async function tryAutoStartMic() {
  try {
    if (!navigator.permissions || !navigator.permissions.query) return;
    const status = await navigator.permissions.query({ name: "microphone" });
    if (status.state === "granted") await onStartWish();
  } catch (e) { /* iOS may not support permissions.query */ }
}

document.addEventListener("DOMContentLoaded", init);

// 測試用（不影響一般使用）
window.__liangyuan = {
  beginDraw,
  randomLot,
  lotByN,
  revealLot,
  registerClap,
  startMic,
  showScreen,
  renderShareCard,
  shareLot,
  poseTong,
  nudgeTong,
  mountTong,
  get state() { return state; },
  LOTS
};
